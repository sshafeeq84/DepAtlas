[project]
name = "depatlas"
version = "0.1.4"
description = "Reads your codebase and builds a living dependency graph across services, teams, and repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shameel" },
]
keywords = [
     "dependency-graph",
    "static-analysis",
    "code-analysis",
    "dependency-scanner",
    "service-mapping",
    "cli",
    "devtools",
    "codeowners",
    "microservices",
    "python",
    "java",
    "javascript",
    "typescript",
    "github",
    "aws",
    "codecommit",
    "sqlite",
    "graphviz",
    "ast",
    "impact-analysis",
    "breaking-changes",
    "devops",
    "software-architecture",
    "team-ownership",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "javalang>=0.13",
    "esprima>=4.0",
    "requests>=2.28",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/sshafeeq84/DepAtlas"
Repository = "https://github.com/sshafeeq84/DepAtlas"
Issues = "https://github.com/sshafeeq84/DepAtlas/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
depatlas = "depatlas.cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["depatlas*"]
